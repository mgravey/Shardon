[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shardon-router-api"
version = "0.1.0"
description = "Inference router plane for Shardon."
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.0",
  "fastapi>=0.118.3",
  "pydantic>=2.12.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.38.0",
  "shardon-core",
]

[project.scripts]
shardon-router-api = "shardon_router_api.main:main"

[tool.uv.sources]
shardon-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/shardon_router_api"]
